name: Android WireGuard LAB CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "native/wireguard/**"
      - "scripts/stage-wireguard-lab-arm64.sh"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-wireguard-lab-ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "native/wireguard/**"
      - "scripts/stage-wireguard-lab-arm64.sh"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-wireguard-lab-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build WireGuard LAB APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go 1.24.3
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.3"
          cache: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 and pinned NDK
        run: sdkmanager "platforms;android-36" "ndk;28.2.13676358"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build native WireGuard arm64-v8a
        working-directory: native/wireguard
        run: make build-arm64

      - name: Stage JNI libraries for WireGuard LAB
        run: bash scripts/stage-wireguard-lab-arm64.sh

      - name: Run backend JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Compile WireGuard LAB APK
        run: gradle --no-daemon :app:assembleWireguardLab

      - name: Verify native libraries are packaged
        run: |
          APK="$(find app/build/outputs/apk/wireguardLab -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          echo "Inspecting $APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libsoberania-wireguard-go.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libsoberania-wg.so'

      - name: Upload WireGuard LAB APK
        uses: actions/upload-artifact@v4
        with:
          name: soberania-wireguard-lab-arm64
          path: app/build/outputs/apk/wireguardLab/*.apk
          if-no-files-found: error
