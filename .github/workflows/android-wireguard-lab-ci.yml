name: Android WireGuard LAB CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "native/wireguard/**"
      - "scripts/stage-wireguard-lab.sh"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-wireguard-lab-ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "native/wireguard/**"
      - "scripts/stage-wireguard-lab.sh"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-wireguard-lab-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-wireguard-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WireGuard LAB APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go 1.24.3
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.3"
          cache: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 and pinned NDK
        run: sdkmanager "platforms;android-36" "ndk;28.2.13676358"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build native WireGuard ABIs
        working-directory: native/wireguard
        run: make build-all

      - name: Stage JNI libraries for WireGuard LAB
        run: bash scripts/stage-wireguard-lab.sh

      - name: Run backend JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Compile WireGuard LAB APK
        run: gradle --no-daemon :app:assembleWireguardLab

      - name: Verify native libraries are packaged
        run: |
          APK="$(find app/build/outputs/apk/wireguardLab -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          echo "Inspecting $APK"
          for abi in arm64-v8a x86_64; do
            unzip -l "$APK" | grep "lib/$abi/libsoberania-wireguard-go.so"
            unzip -l "$APK" | grep "lib/$abi/libsoberania-wg.so"
          done

      - name: Upload WireGuard LAB APK
        uses: actions/upload-artifact@v4
        with:
          name: soberania-wireguard-lab-arm64-x86_64
          path: app/build/outputs/apk/wireguardLab/*.apk
          if-no-files-found: error

  emulator-smoke:
    name: x86_64 Android native smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_AVD_HOME: ${{ runner.temp }}/android-avd

    steps:
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install emulator and x86_64 system image
        run: |
          sdkmanager             "platform-tools"             "emulator"             "system-images;android-35;default;x86_64"

      - name: Create AVD
        run: |
          mkdir -p "$ANDROID_AVD_HOME"

          echo "no" | avdmanager create avd             --force             --name soberania-ci             --package "system-images;android-35;default;x86_64"

          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          avdmanager list avd
          find "$ANDROID_AVD_HOME" -maxdepth 2 -type f -print | sort

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Download WireGuard LAB APK
        uses: actions/download-artifact@v4
        with:
          name: soberania-wireguard-lab-arm64-x86_64
          path: lab-apk

      - name: Boot emulator
        run: |
          nohup "$ANDROID_HOME/emulator/emulator"             -avd soberania-ci             -no-window             -noaudio             -no-boot-anim             -no-snapshot             -gpu swiftshader_indirect             -camera-back none             -camera-front none             > emulator.log 2>&1 &

          if ! timeout 120 adb wait-for-device; then
            echo "Emulator did not appear in ADB within 120 seconds."
            cat emulator.log
            exit 1
          fi

          for attempt in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then
              break
            fi

            if [ "$attempt" = "120" ]; then
              cat emulator.log
              exit 1
            fi

            sleep 2
          done

          adb shell input keyevent 82 || true

      - name: Install LAB APK
        run: |
          APK="$(find lab-apk -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          adb install -r "$APK"

      - name: Run linker and FD ownership smoke
        run: |
          adb logcat -c

          adb shell am start -W             -n org.soberania.app.wireguardlab/org.soberania.app.transport.wireguard.lab.WireGuardLabSmokeActivity

          sleep 3

          adb logcat -d -s SoberaniaWgSmoke:I '*:S' | tee wireguard-smoke.log

          grep "SMOKE_NATIVE_AVAILABLE" wireguard-smoke.log
          grep "SMOKE_FD_OWNERSHIP" wireguard-smoke.log
          grep "SOBERANIA_WG_SMOKE_OK" wireguard-smoke.log
          grep "v0.0.0-20250521234502-f333402bd9cb" wireguard-smoke.log
